# Profile DEV: chay BE voi PostgreSQL local (docker-compose).
# Yeu cau: docker compose up -d (PostgreSQL chay o localhost:5432/center)
# Khoi dong: -Dspring-boot.run.profiles=dev (hoac IntelliJ Active profiles = dev)
# Tai khoan admin mac dinh: admin / Admin@123
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/center}
    username: ${DB_USERNAME:center}
    password: ${DB_PASSWORD:center}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
