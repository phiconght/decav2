# Profile DEV: chay BE khong can Postgres/Docker (DB H2 in-memory).
# Kich hoat bang: --spring.profiles.active=dev (hoac -Dspring-boot.run.profiles=dev).
# Prod van dung Postgres + Flyway nhu application.yml mac dinh.
spring:
  datasource:
    url: jdbc:h2:mem:center;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # Hibernate tu tao schema tu entity (khong dung Flyway o dev)
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
