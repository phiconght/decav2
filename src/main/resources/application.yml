server:
  port: 9090
  servlet:
    context-path: /

spring:
  application:
    name: center-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/center}
    username: ${DB_USERNAME:center}
    password: ${DB_PASSWORD:center}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

app:
  storage:
    provider: local
    local-root: ${STORAGE_LOCAL_ROOT:D:/duantrungtam/Code Version 2/Files}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp
    max-file-size-bytes: 10485760
  jwt:
    secret: ${APP_JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtdG8tYS1sb25nLXJhbmRvbS1iYXNlNjQtdmFsdWUtMTIzNDU2Nzg=}
    issuer: center-api
    access-token-ttl-minutes: ${APP_JWT_ACCESS_TTL:1440}
    refresh-token-ttl-days: ${APP_JWT_REFRESH_TTL:7}
  bootstrap:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:Admin@123}
  jobs:
    exam-backfill:
      # Bu map De thi (BY_CLASS) <-> Hoc vien con thieu, lay tu class_students
      enabled: ${APP_EXAM_BACKFILL_ENABLED:true}
      fixed-delay: ${APP_EXAM_BACKFILL_FIXED_DELAY:60000}     # ms, mac dinh 60s
      initial-delay: ${APP_EXAM_BACKFILL_INITIAL_DELAY:30000} # ms, cho app khoi dong
    question-result-backfill:
      # Bu ket qua cham tung cau (exam_question_result) cho bai DA_LAM nop truoc khi co bang
      enabled: ${APP_QUESTION_RESULT_BACKFILL_ENABLED:true}
      fixed-delay: ${APP_QUESTION_RESULT_BACKFILL_FIXED_DELAY:60000}     # ms, mac dinh 60s
      initial-delay: ${APP_QUESTION_RESULT_BACKFILL_INITIAL_DELAY:45000} # ms, cho app khoi dong
    schedule-gen:
      # Sinh/mo rong buoi hoc tu quy tac lich (idempotent)
      enabled: ${APP_SCHEDULE_GEN_ENABLED:true}
      cron: "0 0 1 * * *"        # 01:00 hang ngay
      horizon-weeks: 8
    attendance-act:
      # Tao session_attendance cho buoi trong ngay tu roster + ap nghi phep
      enabled: ${APP_ATTENDANCE_ACT_ENABLED:true}
      cron: "0 5 0 * * *"        # 00:05 hang ngay
    close-session:
      # Buoi PLANNED da qua gio ket thuc -> DONE
      enabled: ${APP_CLOSE_SESSION_ENABLED:true}
      cron: "0 30 23 * * *"      # 23:30 hang ngay
    missing-scan:
      # Quet thieu check-in/check-out buoi PLANNED hom nay -> bao phu huynh
      enabled: ${APP_MISSING_SCAN_ENABLED:true}
      fixed-delay: ${APP_MISSING_SCAN_FIXED_DELAY:300000}   # ms, mac dinh 5 phut
      grace-minutes: 15          # tre qua start+grace -> TRE (ScheduleService.checkin) / qua han check
    session-remind:
      # Nhac HV + GV khi buoi PLANNED sap bat dau (PH chi khi bat tuong minh preference)
      enabled: ${APP_SESSION_REMIND_ENABLED:true}
      fixed-delay: ${APP_SESSION_REMIND_FIXED_DELAY:60000}  # ms, mac dinh 60s (de khong truot cua so 15')
      remind-before-minutes: ${APP_SESSION_REMIND_BEFORE:15} # phut truoc gio bat dau
    notify-worker:
      # Gui outbox thong bao PENDING qua PushSender (hien LogPushSender stub)
      enabled: ${APP_NOTIFY_WORKER_ENABLED:true}
      fixed-delay: ${APP_NOTIFY_WORKER_FIXED_DELAY:60000}   # ms, mac dinh 60s
      max-retry: ${APP_NOTIFY_WORKER_MAX_RETRY:5}
  qr:
    period-seconds: 30
    secret: ${APP_QR_SECRET:dev-qr-secret-change-me-to-a-long-random-value}
  schedule:
    timezone: "Asia/Ho_Chi_Minh"
  report:
    score-band-count: 10          # so khoang chia pho diem (§12)
  practice:                        # Giao bai luyen tap (§10)
    num-questions: 10
    duration-minutes: 30
    deadline-days: 7
    weak-threshold: 0.6
    min-sample: 3
    max-pending: 3
    max-per-day: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    com.trungtam: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
