server:
  port: 9090
  servlet:
    context-path: /

spring:
  application:
    name: center-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/center}
    username: ${DB_USERNAME:center}
    password: ${DB_PASSWORD:center}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

app:
  storage:
    provider: local
    local-root: ${STORAGE_LOCAL_ROOT:D:/duantrungtam/Code Version 2/Files}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp
    max-file-size-bytes: 10485760
  jwt:
    secret: ${APP_JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtdG8tYS1sb25nLXJhbmRvbS1iYXNlNjQtdmFsdWUtMTIzNDU2Nzg=}
    issuer: center-api
    access-token-ttl-minutes: ${APP_JWT_ACCESS_TTL:15}
    refresh-token-ttl-days: ${APP_JWT_REFRESH_TTL:7}
  bootstrap:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:Admin@123}
  jobs:
    exam-backfill:
      # Bu map De thi (BY_CLASS) <-> Hoc vien con thieu, lay tu class_students
      enabled: ${APP_EXAM_BACKFILL_ENABLED:true}
      fixed-delay: ${APP_EXAM_BACKFILL_FIXED_DELAY:60000}     # ms, mac dinh 60s
      initial-delay: ${APP_EXAM_BACKFILL_INITIAL_DELAY:30000} # ms, cho app khoi dong

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    com.trungtam: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
