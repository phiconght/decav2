server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: center-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/center}
    username: ${DB_USERNAME:center}
    password: ${DB_PASSWORD:center}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # Khoa bi mat HMAC dang Base64, toi thieu 256-bit. Doi gia tri nay o moi truong production (bien moi truong APP_JWT_SECRET).
    secret: ${APP_JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtdG8tYS1sb25nLXJhbmRvbS1iYXNlNjQtdmFsdWUtMTIzNDU2Nzg=}
    issuer: center-api
    access-token-ttl-minutes: ${APP_JWT_ACCESS_TTL:15}
    refresh-token-ttl-days: ${APP_JWT_REFRESH_TTL:7}
  bootstrap:
    # Tai khoan ADMIN tao tu dong khi DB chua co nguoi dung. Doi mat khau ngay o production.
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:Admin@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    com.trungtam: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
